<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Pledge Tracker - Progress</title>
    <link rel="stylesheet" href="css/public.css">
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>JAGOM Ikorodu Pledge Progress</h1>
            <p>Anonymous pledge tracking - showing total progress</p>
        </div>

        <!-- SUMMARY CARDS -->
        <div class="summary-cards" id="summaryCards">
            <div class="card">
                <h3>Total Pledged</h3>
                <div class="amount blue" id="totalPledged">$0.00</div>
            </div>
            <div class="card">
                <h3>Total Received</h3>
                <div class="amount green" id="totalReceived">$0.00</div>
            </div>
            <div class="card">
                <h3>Remaining</h3>
                <div class="amount orange" id="remaining">$0.00</div>
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-container">
            <div id="loadingMessage" class="loading">Loading data...</div>
            <div id="tableWrapper" style="display:none;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Pledged</th>
                            <th>Paid</th>
                            <th>Balance</th>
                            <th>Progress</th>
                        </tr>
                    </thead>
                    <tbody id="pledgeTableBody">
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state" style="display:none;">
                    <h3>No pledges found</h3>
                    <p>Check back soon for updates.</p>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <span class="refresh-indicator" id="refreshIndicator">Auto-refreshes every 30s • Loading...</span>
        </div>
    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/public.js"></script>

</body>
</html>
