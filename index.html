<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Pledge Tracker - Progress</title>
    <link rel="stylesheet" href="css/public.css">
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>JAGOM Ikorodu Building Pledge Tracker</h1>
            <p>Anonymous pledge tracking - showing total progress Summary</p>
        </div>

        <!-- SUMMARY CARDS -->
        <div class="summary-cards" id="summaryCards">
            <div class="card">
                <h3>Total Pledged</h3>
                <div class="amount blue" id="totalPledged">₦0.00</div>
            </div>
            <div class="card">
                <h3>Total Received</h3>
                <div class="amount green" id="totalReceived">₦0.00</div>
            </div>
            <div class="card">
                <h3>Remaining</h3>
                <div class="amount orange" id="remaining">₦0.00</div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <span class="refresh-indicator" id="refreshIndicator">Auto-refreshes every 30s • Loading...</span>
        </div>
    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/public.js"></script>

</body>
</html>
